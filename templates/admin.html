<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台管理 - AI 智能助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body class="admin-page">
    <header class="topbar">
      <div class="topbar-brand">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="app-logo" onerror="this.style.display='none'" />
        <span class="topbar-brand-name">后台管理</span>
      </div>
      <div class="toolbar">
        <button id="chat-btn" class="btn-secondary" type="button">进入聊天</button>
        <button id="logout-btn" type="button">退出</button>
      </div>
    </header>

    <main class="admin-shell">
      <nav class="admin-tabs">
        <button class="admin-tab active" data-tab="dashboard" type="button">仪表盘</button>
        <button class="admin-tab" data-tab="users" type="button">账号管理</button>
        <button class="admin-tab" data-tab="usage" type="button">用量统计</button>
        <button class="admin-tab" data-tab="documents" type="button">文档管理</button>
        <button class="admin-tab" data-tab="config" type="button">配置管理</button>
        <button class="admin-tab" data-tab="audit" type="button">审计日志</button>
      </nav>

      <!-- 仪表盘 -->
      <section class="admin-panel tab-panel active" id="tab-dashboard">
        <h2>系统概览</h2>
        <div id="dashboard-cards" class="dashboard-cards">
          <div class="stat-card"><div class="stat-value" id="stat-users">-</div><div class="stat-label">注册用户</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-conversations">-</div><div class="stat-label">会话总数</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-tokens">-</div><div class="stat-label">今日 Token</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-documents">-</div><div class="stat-label">文档数量</div></div>
        </div>
      </section>

      <!-- 账号管理 -->
      <section class="admin-panel tab-panel" id="tab-users">
        <div class="panel-header">
          <h2>账号管理</h2>
          <button id="show-create-user" type="button">+ 新增用户</button>
        </div>
        <div id="create-user-form" class="admin-form" hidden>
          <label class="stack-field"><span>用户名</span><input id="new-username" type="text" /></label>
          <label class="stack-field"><span>密码</span><input id="new-password" type="password" /></label>
          <div class="toggle-field"><span>管理员</span><div class="toggle-inline"><input id="new-is-admin" type="checkbox" /><span>是</span></div></div>
          <div style="display:flex;gap:8px;align-items:end">
            <button id="create-user-btn" type="button">创建</button>
            <button id="cancel-create-user" class="btn-secondary" type="button">取消</button>
          </div>
        </div>
        <p id="users-error" class="error"></p>
        <div id="users-list" class="users-list"></div>
      </section>

      <!-- 用量统计 -->
      <section class="admin-panel tab-panel" id="tab-usage">
        <div class="panel-header">
          <h2>Token 用量统计</h2>
          <div class="toolbar">
            <select id="usage-range">
              <option value="today">今日</option>
              <option value="week">近 7 天</option>
              <option value="month" selected>近 30 天</option>
            </select>
            <button id="refresh-usage" class="btn-secondary" type="button">刷新</button>
          </div>
        </div>
        <div id="usage-table-container"></div>
      </section>

      <!-- 文档管理 -->
      <section class="admin-panel tab-panel" id="tab-documents">
        <div class="panel-header">
          <h2>文档管理</h2>
          <button id="show-upload-doc" type="button">+ 上传文档</button>
        </div>
        <div id="upload-doc-form" class="admin-form" hidden>
          <label class="stack-field"><span>标题</span><input id="doc-title" type="text" placeholder="留空则使用文件名" /></label>
          <label class="stack-field"><span>分类</span><input id="doc-category" type="text" placeholder="如：SOP、通知" /></label>
          <label class="stack-field"><span>文件</span><input id="doc-file" type="file" /></label>
          <div style="display:flex;gap:8px;align-items:end">
            <button id="upload-doc-btn" type="button">上传</button>
            <button id="cancel-upload-doc" class="btn-secondary" type="button">取消</button>
          </div>
        </div>
        <p id="docs-error" class="error"></p>
        <div id="admin-docs-list"></div>
      </section>

      <!-- 配置管理 -->
      <section class="admin-panel tab-panel" id="tab-config">
        <div class="panel-header">
          <div>
            <h2>配置文件管理</h2>
            <p class="panel-hint">直接编辑白名单配置文件。保存后会自动热更新支持的运行项。</p>
          </div>
          <button id="reload-config-btn" class="btn-secondary" type="button">重新加载</button>
        </div>
        <div class="config-toolbar">
          <label class="config-file-field">
            <span>配置文件</span>
            <select id="config-file-select"></select>
          </label>
          <div id="config-restart-hint" class="config-restart-hint"></div>
        </div>
        <div id="config-description" class="panel-hint"></div>
        <div class="config-meta">文件路径：<code id="config-path"></code></div>
        <p id="config-error" class="error"></p>
        <p id="config-save-result" class="config-save-result"></p>
        <textarea id="config-editor" class="config-editor" spellcheck="false"></textarea>
        <div class="panel-actions">
          <button id="save-config-btn" type="button">保存当前文件</button>
        </div>
      </section>

      <!-- 审计日志 -->
      <section class="admin-panel tab-panel" id="tab-audit">
        <div class="panel-header">
          <h2>审计日志</h2>
          <button id="refresh-audit" class="btn-secondary" type="button">刷新</button>
        </div>
        <div id="audit-table-container"></div>
        <div class="panel-actions">
          <button id="audit-load-more" class="btn-secondary" type="button">加载更多</button>
        </div>
      </section>
    </main>

    <script>
      window.__ADMIN_CONFIG__ = {
        username: {{ username | tojson }},
        configFiles: {{ config_files | tojson }},
      };
    </script>
    <script src="{{ url_for('static', filename='admin.js') }}"></script>
  </body>
</html>
